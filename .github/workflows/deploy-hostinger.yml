name: Deploy to Hostinger

# Uploads hostinger-site/ to public_html. Runs on every push to main that touches
# the site, and can be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'hostinger-site/**'
      - 'scripts/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Catch a news.json edit that was never rendered into the HTML.
      - name: Check Actualités are rendered
        run: node scripts/render-news.mjs --check

      # Catch a landing/ edit that was never rebuilt into hostinger-site/.
      - name: Check the deploy folder is up to date
        run: |
          ./landing/build-for-hostinger.sh > /dev/null
          if ! git diff --quiet -- hostinger-site; then
            echo "::error::hostinger-site/ is out of date. Run ./landing/build-for-hostinger.sh and commit the result."
            git diff --stat -- hostinger-site
            exit 1
          fi

      # Adding repository secrets needs admin on the repo. Until an org owner sets
      # them, skip the upload with a warning rather than failing every push.
      - name: Check the Hostinger secrets are configured
        id: ftp
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Deploy skipped::HOSTINGER_FTP_* secrets are not set, so the site was not uploaded. The build was still verified. See docs/operations.md.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Hostinger
        if: steps.ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./hostinger-site/
          # TEMPORARY — staging folder while the pipeline is being verified.
          # To go live: change the fallback back to '/public_html/'.
          server-dir: ${{ vars.HOSTINGER_REMOTE_DIR || '/public_html/_deploytest/' }}
          # Only changed files are transferred; state is kept in .ftp-deploy-sync-state.json
          # on the server. Never wipe the remote folder automatically.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
